services:

  # ======================
  # NGINX
  # ======================
  nginx:
    image: nginx:latest
    container_name: ai-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/html:/usr/share/nginx/html
      - ./logs/nginx:/logs/nginx

    networks:
      - ai-network


  # ======================
  # APACHE
  # ======================
  apache:
    image: httpd:latest
    container_name: ai-apache

    ports:
      - "8081:80"

    volumes:
      - ./apache/html:/usr/local/apache2/htdocs
      - ./apache/apache.conf:/usr/local/apache2/conf/httpd.conf
      - ./logs/apache:/logs/apache

    networks:
      - ai-network


  # ======================
  # LOKI
  # ======================
  loki:
    image: grafana/loki:3.0.0
    container_name: ai-loki

    ports:
      - "3100:3100"

    volumes:
      - ./loki/config.yml:/etc/loki/config.yml
      - loki_data:/loki

    command:
      - "-config.file=/etc/loki/config.yml"

    networks:
      - ai-network


  # ======================
  # PROMTAIL
  # ======================
  promtail:
    image: grafana/promtail:3.0.0
    container_name: ai-promtail

    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - ./logs:/logs:ro

    command:
      - "-config.file=/etc/promtail/config.yml"

    depends_on:
      - loki

    networks:
      - ai-network


  # ======================
  # GRAFANA
  # ======================
  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana

    ports:
      - "3000:3000"

    depends_on:
      - loki

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - ai-network


  # ======================
  # N8N
  # ======================
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-n8n

    ports:
      - "5678:5678"

    volumes:
      - ./n8n:/home/node/.n8n

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false

    depends_on:
      - loki
      - mongodb

    networks:
      - ai-network


  # ======================
  # MONGODB
  # ======================
  mongodb:
    image: mongo:8
    container_name: ai-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: change_this_password

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - ai-network


  # ======================
  # FASTAPI
  # ======================
  api:
    build: ./api
    container_name: ai-api

    ports:
      - "8000:8000"

    environment:
      MONGO_URI: mongodb://admin:change_this_password@mongodb:27017/?authSource=admin
      MONGO_DATABASE: ai_incident_analyst
      MONGO_COLLECTION: incidents

    depends_on:
      - mongodb

    networks:
      - ai-network


# ======================
# NETWORKS
# ======================
networks:
  ai-network:
    driver: bridge


# ======================
# VOLUMES
# ======================
volumes:
  loki_data:
  grafana_data:
  mongodb_data:
