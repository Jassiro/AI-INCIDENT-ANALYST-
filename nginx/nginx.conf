events {

    worker_connections 1024;

}


http {


    include /etc/nginx/mime.types;


    server {


        listen 80;


        server_name localhost;


        root /usr/share/nginx/html;


        index index.html;



        access_log /logs/nginx/access.log;


        error_log /logs/nginx/error.log;



        location / {


            try_files $uri $uri/ =404;


        }


    }


}